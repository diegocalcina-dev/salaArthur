<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TurmaXP — Entrar na Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --orange:#FF6B00; --orange-deep:#E15400; --orange-soft:#FF8A3D;
    --gold:#F7C948; --gold-deep:#D9A516;
    --chakra-blue:#3D9BFF;
    --bg:#120B2E; --bg-2:#170E38; --card:#1E1240; --raised:#2A1B50; --border:#3D2A70;
    --text:#FFFFFF; --text-dim:#B8A9D9; --text-faint:#6E5E9B;
    --r-md:16px; --r-lg:20px; --r-pill:999px;
    --ink:#0B0620;
    --glow-orange:0 5px 0 var(--orange-deep), 0 12px 22px -8px rgba(255,107,0,.6);
    --maxw:390px;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { background:#0A0620; }
  body {
    font-family:'Nunito',system-ui,sans-serif; color:var(--text); line-height:1.4;
    -webkit-font-smoothing:antialiased; background:var(--bg);
    min-height:100vh;
  }
  .display { font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:.5px; line-height:1; font-weight:400; }
  .phone {
    max-width:var(--maxw); margin:0 auto; position:relative; min-height:100vh;
    display:flex; flex-direction:column;
    background:
      radial-gradient(80% 42% at 50% 0%, rgba(255,107,0,.22) 0%, rgba(255,107,0,0) 60%),
      radial-gradient(70% 30% at 50% 8%, rgba(61,155,255,.16) 0%, rgba(61,155,255,0) 60%),
      linear-gradient(180deg, #1a0f3e 0%, var(--bg) 55%);
  }

  /* ===== SPLASH / PORTAL ===== */
  .splash {
    position:relative; height:300px; flex-shrink:0; overflow:hidden;
    display:grid; place-items:center;
  }
  /* raios de chakra partindo do centro */
  .rays {
    position:absolute; top:50%; left:50%; width:600px; height:600px;
    transform:translate(-50%,-50%);
    background:
      repeating-conic-gradient(from 0deg at 50% 50%,
        rgba(255,107,0,.16) 0deg 4deg, transparent 4deg 16deg);
    -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 62%);
            mask-image:radial-gradient(circle, #000 0%, transparent 62%);
    animation:spin 28s linear infinite;
  }
  .rays.blue {
    background:repeating-conic-gradient(from 8deg at 50% 50%,
      rgba(61,155,255,.13) 0deg 3deg, transparent 3deg 20deg);
    animation:spin 38s linear infinite reverse;
  }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

  /* anéis do portal */
  .ring {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid;
  }
  .ring.r1 { width:150px; height:150px; border-color:rgba(255,107,0,.6); box-shadow:0 0 40px -4px rgba(255,107,0,.6), inset 0 0 30px -8px rgba(255,107,0,.5); animation:pulse 3s ease-in-out infinite; }
  .ring.r2 { width:210px; height:210px; border-color:rgba(61,155,255,.35); border-style:dashed; animation:spin 20s linear infinite; }
  .ring.r3 { width:270px; height:270px; border-color:rgba(247,201,72,.18); animation:pulse 3.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{ opacity:.7; } 50%{ opacity:1; transform:translate(-50%,-50%) scale(1.04); } }

  /* símbolo da folha estilizado (espiral) */
  .leaf-core {
    position:relative; z-index:2; width:96px; height:96px; border-radius:50%;
    background:radial-gradient(circle at 50% 40%, #FFB061, var(--orange) 55%, #b94c00 100%);
    border:3px solid var(--ink);
    display:grid; place-items:center; font-size:48px;
    box-shadow:0 0 40px 2px rgba(255,107,0,.7), 0 8px 0 var(--orange-deep);
    animation:bob 3s ease-in-out infinite;
  }
  @keyframes bob { 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }

  /* partículas/estrelas */
  .particle { position:absolute; border-radius:50%; opacity:.8; z-index:1; box-shadow:0 0 8px 1px currentColor; }

  /* ===== CONTEÚDO ===== */
  .body {
    flex:1; padding:8px 26px 30px; display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .logo { font-size:54px; line-height:.9; }
  .logo .t { color:var(--orange); -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; filter:drop-shadow(0 4px 0 var(--orange-deep)); }
  .logo .x { color:var(--gold); -webkit-text-stroke:2.5px var(--ink); paint-order:stroke fill; filter:drop-shadow(0 4px 0 var(--gold-deep)); }
  .tagline { font-size:14px; font-weight:800; color:var(--text-dim); margin-top:8px; }
  .school-badge {
    display:inline-flex; align-items:center; gap:7px; margin-top:14px;
    font-size:11.5px; font-weight:900; color:#fff;
    background:var(--raised); border:1.5px solid var(--border); border-radius:var(--r-pill);
    padding:6px 14px;
  }
  .school-badge .d { width:7px; height:7px; border-radius:50%; background:var(--orange); box-shadow:0 0 8px var(--orange); }

  /* ===== OTP ===== */
  .otp-wrap { width:100%; margin-top:30px; }
  .otp-label { font-size:11px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--orange-soft); margin-bottom:14px; }
  .otp { display:flex; gap:9px; justify-content:center; }
  .otp-box {
    width:46px; height:58px; border-radius:14px;
    background:var(--card); border:2.5px solid var(--border);
    display:grid; place-items:center;
    font-family:'Anton',sans-serif; font-size:28px; color:#fff;
  }
  .otp-box.filled { border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 1px rgba(247,201,72,.3); }
  .otp-box.active {
    border-color:var(--orange);
    box-shadow:0 0 0 3px rgba(255,107,0,.22), 0 0 18px -2px rgba(255,107,0,.6);
    animation:caret 1.1s ease-in-out infinite;
  }
  .otp-box.active::after { content:""; width:2.5px; height:26px; background:var(--orange); border-radius:2px; }
  @keyframes caret { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  .otp-hint { font-size:11.5px; font-weight:700; color:var(--text-faint); margin-top:13px; }

  /* ===== BOTÃO ===== */
  .enter-btn {
    width:100%; min-height:58px; margin-top:28px; border-radius:var(--r-pill); cursor:pointer;
    font-family:'Anton',sans-serif; font-size:20px; letter-spacing:1px; text-transform:uppercase;
    color:#fff; text-shadow:0 2px 0 rgba(11,6,32,.45);
    background:linear-gradient(180deg, var(--orange-soft), var(--orange));
    border:3px solid var(--ink); box-shadow:var(--glow-orange);
    position:relative; overflow:hidden;
    animation:btnPulse 2.4s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow:0 5px 0 var(--orange-deep), 0 12px 22px -8px rgba(255,107,0,.6), 0 0 0 0 rgba(255,107,0,.5); }
    50%     { box-shadow:0 5px 0 var(--orange-deep), 0 12px 22px -8px rgba(255,107,0,.6), 0 0 0 6px rgba(255,107,0,.12); }
  }
  .enter-btn:active { transform:translateY(4px); }
  .enter-btn::after {
    content:""; position:absolute; inset:0;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.16) 0 6px, transparent 6px 16px);
    pointer-events:none;
  }

  .parent-link { margin-top:24px; font-size:13px; font-weight:800; color:var(--text-dim); cursor:pointer; }
  .parent-link b { color:var(--orange-soft); }
</style>
</head>
<body>
<div class="phone" data-screen-label="Entrada por Código">

  <!-- ===== SPLASH ===== -->
  <div class="splash" id="splash">
    <div class="rays"></div>
    <div class="rays blue"></div>
    <div class="ring r3"></div>
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="leaf-core">🍥</div>
  </div>

  <!-- ===== CORPO ===== -->
  <div class="body">
    <div class="logo display"><span class="t">Turma</span><span class="x">XP</span></div>
    <div class="tagline">A arena ninja da sua turma</div>
    <div class="school-badge"><span class="d"></span>5ºB • Colégio Konoha</div>

    <!-- OTP -->
    <div class="otp-wrap">
      <div class="otp-label">Código da missão</div>
      <div class="otp">
        <div class="otp-box filled">N</div>
        <div class="otp-box filled">7</div>
        <div class="otp-box filled">K</div>
        <div class="otp-box active"></div>
        <div class="otp-box"></div>
        <div class="otp-box"></div>
      </div>
      <div class="otp-hint">🔑 Peça o código para seus pais</div>
    </div>

    <!-- BOTÃO -->
    <button class="enter-btn">Entrar na Arena</button>

    <div class="parent-link">Sou pai ou mãe <b>→</b></div>
  </div>

</div>

<script>
  // partículas flutuantes no splash
  (function () {
    const splash = document.getElementById('splash');
    const colors = ['#FF8A3D', '#3D9BFF', '#F7C948', '#ffffff'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const sz = (2 + Math.random() * 4).toFixed(1);
      p.style.width = sz + 'px';
      p.style.height = sz + 'px';
      const c = colors[Math.floor(Math.random() * colors.length)];
      p.style.color = c;
      p.style.background = c;
      p.style.left = Math.random() * 100 + '%';
      p.style.top = Math.random() * 100 + '%';
      p.style.opacity = (0.3 + Math.random() * 0.6).toFixed(2);
      const dur = (3 + Math.random() * 4).toFixed(1);
      p.style.animation = `floaty ${dur}s ease-in-out ${(-Math.random()*4).toFixed(1)}s infinite`;
      splash.appendChild(p);
    }
    const style = document.createElement('style');
    style.textContent = '@keyframes floaty { 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-14px) scale(1.3);} }';
    document.head.appendChild(style);
  })();
</script>
</body>
</html>
